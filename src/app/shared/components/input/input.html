<div class="app-input-container">
  <!-- Optional Label -->
  @if (label()) {
    <label class="input-label" [class]="'label-' + state()">{{ label() }}</label>
  }

  <!-- Input Wrapper containing addons -->
  <div [class]="wrapperClasses()">

    <!-- Prefix Addon: FA icon class (contains 'fa-') or plain text (e.g. '$') -->
    @if (prefix()) {
      <span class="input-addon addon-prefix">
        @if (isIconClass(prefix()!)) {
          <i [class]="prefix()" aria-hidden="true"></i>
        } @else {
          {{ prefix() }}
        }
      </span>
    }

    <!-- Native Input Element -->
    <input
      [type]="type()"
      [placeholder]="placeholder()"
      [value]="value()"
      (input)="onInput($event)"
      class="native-input"
    />

    <!-- Suffix Addon: FA icon class or plain text (e.g. 'USD') -->
    @if (suffix()) {
      <span class="input-addon addon-suffix">
        @if (isIconClass(suffix()!)) {
          <i [class]="suffix()" aria-hidden="true"></i>
        } @else {
          {{ suffix() }}
        }
      </span>
    }
  </div>

  <!-- Validation Feedback Message -->
  @if (message() && state() === 'error') {
    <span class="feedback-message error-message" role="alert">
      <i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i>
      {{ message() }}
    </span>
  } @else if (message() && state() === 'success') {
    <span class="feedback-message success-message">
      <i class="fa-solid fa-circle-check" aria-hidden="true"></i>
      {{ message() }}
    </span>
  }
</div>
