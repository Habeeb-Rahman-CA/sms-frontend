<div class="app-input-container">
  <!-- Optional Label -->
  @if (label()) {
    <div class="label-container">
      <label class="input-label" [class]="'label-' + state()">{{ label() }}</label>
      @if (state() === 'error' && message()) {
        <span class="label-error-icon-wrapper" [attr.data-tooltip]="message()">
          <i class="fa-solid fa-circle-exclamation error-icon"></i>
        </span>
      }
    </div>
  }

  <!-- Input Wrapper containing addons -->
  <div [class]="wrapperClasses()">

    <!-- Prefix Addon: FA icon class (contains 'fa-') or plain text (e.g. '$') -->
    @if (prefix()) {
      <span class="input-addon addon-prefix">
        @if (isIconClass(prefix()!)) {
          <i [class]="prefix()" aria-hidden="true"></i>
        } @else {
          {{ prefix() }}
        }
      </span>
    }

    <!-- Native Input Element -->
    <input
      [type]="type()"
      [placeholder]="placeholder()"
      [value]="value()"
      (input)="onInput($event)"
      class="native-input"
    />

    <!-- Suffix Addon: FA icon class or plain text (e.g. 'USD') -->
    @if (suffix()) {
      <span 
        class="input-addon addon-suffix" 
        (click)="suffixClick.emit()"
        [style.cursor]="'pointer'"
      >
        @if (isIconClass(suffix()!)) {
          <i [class]="suffix()" aria-hidden="true"></i>
        } @else {
          {{ suffix() }}
        }
      </span>
    }
  </div>
</div>
