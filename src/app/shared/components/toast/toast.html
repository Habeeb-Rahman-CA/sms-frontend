<div class="toast-card" [class]="'toast-' + type()" role="status" aria-live="polite">
  <!-- Toast left brand accent indicator bar inside CSS -->

  <!-- Left Icon Addon -->
  <span class="toast-icon-wrap">
    <i [class]="getIconClass()" aria-hidden="true"></i>
  </span>

  <!-- Message Body Text -->
  <div class="toast-message-box">
    <span class="toast-text">{{ message() }}</span>
  </div>

  <!-- Close Action Trigger Button -->
  <button 
    type="button" 
    class="toast-close-btn" 
    (click)="dismiss()" 
    aria-label="Dismiss notification"
  >
    <i class="fa-solid fa-xmark"></i>
  </button>
</div>
